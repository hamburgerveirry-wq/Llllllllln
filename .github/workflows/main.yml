name: Build Android APK

on:
  push:
    paths:
      - 'on-device-llm-1.3.7-api-one-button-fast-replies-source.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Extract project and build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository containing the ZIP
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore uploaded source archive from previous commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin bd14f0e828a1db61b3558df669926c2eaa987a3b
          git show bd14f0e828a1db61b3558df669926c2eaa987a3b:on-device-llm-1.3.7-api-one-button-fast-replies-source.zip > on-device-llm-1.3.7-api-one-button-fast-replies-source.zip
          test -s on-device-llm-1.3.7-api-one-button-fast-replies-source.zip

      - name: Extract Flutter project ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive='on-device-llm-1.3.7-api-one-button-fast-replies-source.zip'
          test -f "$archive" || { echo "Missing project archive: $archive"; exit 1; }
          mkdir -p project
          unzip -q "$archive" -d project
          test -f project/pubspec.yaml || { echo 'pubspec.yaml was not found at the extracted project root.'; exit 1; }
          test -f project/scripts/build_android.sh || { echo 'scripts/build_android.sh is missing.'; exit 1; }
          echo 'Project archive extracted successfully.'

      - name: Patch Dart compile blockers
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hosting = Path('lib/features/hosting/presentation/device_hosting_page.dart')
          source = hosting.read_text()
          if "onCopy: () => _copy('API key', token)," not in source:
              needle = "trailing: Row("
              if source.count(needle) != 1:
                  raise SystemExit('Expected exactly one API-key trailing row')
              source = source.replace(
                  needle,
                  "onCopy: () => _copy('API key', token),\n                trailing: Row(",
                  1,
              )
          hosting.write_text(source)

          svg_file = Path('lib/features/tools/svg_image_tool.dart')
          source = svg_file.read_text()
          source = source.replace(
              "import 'package:flutter_svg/flutter_svg.dart' show SvgStringLoader;",
              "import 'package:flutter_svg/flutter_svg.dart' as flutter_svg;",
          )
          source = source.replace(
              "import 'package:vector_graphics/vector_graphics.dart' as vg;", ""
          )
          source = source.replace(
              "vg.loadPicture(SvgStringLoader(svg), null)",
              "flutter_svg.vg.loadPicture(flutter_svg.SvgStringLoader(svg), null)",
          )
          source = source.replace(
              "image = await info.picture.toImage(width, height);",
              "final rasterImage = await info.picture.toImage(width, height);\n      image = rasterImage;",
          )
          source = source.replace(
              "image.toByteData(format: ui.ImageByteFormat.png)",
              "rasterImage.toByteData(format: ui.ImageByteFormat.png)",
          )
          if "vg.loadPicture(SvgStringLoader(svg), null)" in source or "image.toByteData(format: ui.ImageByteFormat.png)" in source:
              raise SystemExit('SVG compile blocker remains after patch')
          if "flutter_svg.vg.loadPicture(flutter_svg.SvgStringLoader(svg), null)" not in source:
              raise SystemExit('Could not safely patch SVG renderer API')
          svg_file.write_text(source)
          print('Patched API-key callback and SVG renderer/nullability compile blockers.')
          PY

      - name: Diagnose model loading and API server gating
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = re.compile(r'nGpuLayers|gpuLayers|gpu_layers|vulkan|Vulkan|isModelLoaded|modelLoaded|isLoading|loadModel|startServer|canStart|serverStatus|isServerRunning|enabled\s*:', re.I)
          roots = [Path('lib'), Path('android/app/src/main')]
          hits = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in ('.dart', '.kt', '.java', '.cpp', '.h', '.hpp'):
                      continue
                  try:
                      lines = path.read_text(errors='replace').splitlines()
                  except Exception:
                      continue
                  matched = [(i, line) for i, line in enumerate(lines) if patterns.search(line)]
                  if not matched:
                      continue
                  print(f'\n===== {path} ({len(matched)} matching lines) =====')
                  for i, line in matched:
                      print(f'{i+1}: {line[:240]}')
                      hits += 1
                      if hits >= 180:
                          break
                  if hits >= 180:
                      break
              if hits >= 180:
                  break
          print(f'\nTOTAL MATCHING SOURCE LINES PRINTED: {hits}')
          print('\n===== DEVICE HOSTING PAGE (first 260 lines) =====')
          p = Path('lib/features/hosting/presentation/device_hosting_page.dart')
          if p.exists():
              for i, line in enumerate(p.read_text(errors='replace').splitlines()[:260], 1):
                  print(f'{i}: {line[:240]}')
          PY

      - name: Apply Android Mali Vulkan safety changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/native/patches
          cp .github/patches/vulkan-mali-safety.patch project/native/patches/
          python3 - <<'PY'
          from pathlib import Path

          # Android mobile GPUs use the same physical memory pool as the OS.
          bridge = Path('project/native/src/bridge.cpp')
          source = bridge.read_text()
          old = '''// A card with its own memory (CUDA, Vulkan on a discrete GPU). Phone and
// Apple GPUs share the RAM, so what they take counts against the RAM.
static bool own_memory(ggml_backend_dev_t dev) {
#if defined(__APPLE__)
    (void)dev; return false;
#else
    return dev && ggml_backend_dev_type(dev) == GGML_BACKEND_DEVICE_TYPE_GPU;
#endif
}'''
          new = '''// Android phone/tablet GPUs (including Vulkan devices reported as GPU rather
// than IGPU) share physical RAM with the OS. Never treat their allocations as
// separate VRAM in memory admission; they compete with SurfaceFlinger and apps.
static bool own_memory(ggml_backend_dev_t dev) {
#if defined(__ANDROID__) || defined(__APPLE__)
    (void)dev; return false;
#else
    return dev && ggml_backend_dev_type(dev) == GGML_BACKEND_DEVICE_TYPE_GPU;
#endif
}'''
          if source.count(old) != 1:
              raise SystemExit('Could not uniquely locate own_memory() for Android UMA correction')
          bridge.write_text(source.replace(old, new, 1))

          # Auto mode avoids probing/choosing Mali Vulkan by default. Explicit
          # backend="vulkan" still follows the forced path and preserves support.
          dart = Path('project/lib/inference/ffi/llama_bindings.dart')
          source = dart.read_text()
          old = '''          if (preferred == null && name.contains('opencl') &&
              lib.providesSymbol('od_gpu_device_info_json')) {
            final info = lib
                .lookupFunction<Pointer<Utf8> Function(), Pointer<Utf8> Function()>(
                  'od_gpu_device_info_json',
                )()
                .toDartString();
            final devices = jsonDecode(info);
            final summary = devices is List
                ? devices
                    .map((device) => '${device['backend']} ${device['name']}')
                    .join(' ')
                    .toLowerCase()
                : '';
            // Prefer Vulkan for Mali/Immortalis when both Android variants
            // are present; OpenCL remains the automatic first choice for
            // Adreno, where its vendor-tuned kernels are the better path.
            if ((summary.contains('mali') || summary.contains('immortalis')) &&
                !summary.contains('adreno')) {
              skipped.add('$name: Mali/Immortalis detected; prefer Vulkan');
              continue;
            }
          }'''
          new = '''          if (preferred == null && name.contains('vulkan') &&
              lib.providesSymbol('od_gpu_device_info_json')) {
            final info = lib
                .lookupFunction<Pointer<Utf8> Function(), Pointer<Utf8> Function()>(
                  'od_gpu_device_info_json',
                )()
                .toDartString();
            final devices = jsonDecode(info);
            final summary = devices is List
                ? devices
                    .map((device) => '${device['backend']} ${device['name']}')
                    .join(' ')
                    .toLowerCase()
                : '';
            // Mali Vulkan remains available when explicitly selected, but is
            // not auto-selected until its Android queue/driver path is validated.
            if (summary.contains('mali') || summary.contains('immortalis')) {
              skipped.add('$name: Mali Vulkan is experimental in Auto; select Vulkan explicitly to force it');
              continue;
            }
          }'''
          if source.count(old) != 1:
              raise SystemExit('Could not uniquely locate the existing Mali OpenCL/Vulkan auto-selection block')
          dart.write_text(source.replace(old, new, 1))

          print('Applied Android UMA memory accounting, Mali Vulkan Auto safety, and the pinned llama.cpp patch.')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
          cache-key: flutter-3.47.5-${{ runner.os }}

      - name: Build release APK
        working-directory: project
        shell: bash
        run: bash scripts/build_android.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="project/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          echo "APK size:"
          stat -c '%s bytes' "$apk"
          echo "Checking ZIP integrity and CRC..."
          unzip -tq "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(
            find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -n 1
          )"
          test -n "$build_tools"
          echo "Checking APK alignment..."
          "$build_tools/zipalign" -c -v 4 "$apk"
          echo "Checking APK signature..."
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "All APK checks passed."

      - name: Upload Android APK backup
        uses: actions/upload-artifact@v4
        with:
          name: on-device-llm-android-arm64-release
          path: |
            project/build/app/outputs/flutter-apk/app-release.apk
            project/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
