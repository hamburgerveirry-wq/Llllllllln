name: Build Android APK

on:
  push:
    paths:
      - 'on-device-llm-1.3.7-api-one-button-fast-replies-source.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Extract project and build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository containing the ZIP
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore uploaded source archive from previous commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin bd14f0e828a1db61b3558df669926c2eaa987a3b
          git show bd14f0e828a1db61b3558df669926c2eaa987a3b:on-device-llm-1.3.7-api-one-button-fast-replies-source.zip > on-device-llm-1.3.7-api-one-button-fast-replies-source.zip
          test -s on-device-llm-1.3.7-api-one-button-fast-replies-source.zip

      - name: Extract Flutter project ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive='on-device-llm-1.3.7-api-one-button-fast-replies-source.zip'
          test -f "$archive" || { echo "Missing project archive: $archive"; exit 1; }
          mkdir -p project
          unzip -q "$archive" -d project
          test -f project/pubspec.yaml || { echo 'pubspec.yaml was not found at the extracted project root.'; exit 1; }
          test -f project/scripts/build_android.sh || { echo 'scripts/build_android.sh is missing.'; exit 1; }
          echo 'Project archive extracted successfully.'

      - name: Patch Dart compile blockers
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hosting = Path('lib/features/hosting/presentation/device_hosting_page.dart')
          source = hosting.read_text()
          if "onCopy: () => _copy('API key', token)," not in source:
              needle = "trailing: Row("
              if source.count(needle) != 1:
                  raise SystemExit('Expected exactly one API-key trailing row')
              source = source.replace(
                  needle,
                  "onCopy: () => _copy('API key', token),\n                trailing: Row(",
                  1,
              )
          hosting.write_text(source)

          svg_file = Path('lib/features/tools/svg_image_tool.dart')
          source = svg_file.read_text()
          source = source.replace(
              "import 'package:flutter_svg/flutter_svg.dart' show SvgStringLoader;",
              "import 'package:flutter_svg/flutter_svg.dart' as flutter_svg;",
          )
          source = source.replace(
              "import 'package:vector_graphics/vector_graphics.dart' as vg;", ""
          )
          source = source.replace(
              "vg.loadPicture(SvgStringLoader(svg), null)",
              "flutter_svg.vg.loadPicture(flutter_svg.SvgStringLoader(svg), null)",
          )
          source = source.replace(
              "image = await info.picture.toImage(width, height);",
              "final rasterImage = await info.picture.toImage(width, height);\n      image = rasterImage;",
          )
          source = source.replace(
              "image.toByteData(format: ui.ImageByteFormat.png)",
              "rasterImage.toByteData(format: ui.ImageByteFormat.png)",
          )
          if "vg.loadPicture(SvgStringLoader(svg), null)" in source or "image.toByteData(format: ui.ImageByteFormat.png)" in source:
              raise SystemExit('SVG compile blocker remains after patch')
          if "flutter_svg.vg.loadPicture(flutter_svg.SvgStringLoader(svg), null)" not in source:
              raise SystemExit('Could not safely patch SVG renderer API')
          svg_file.write_text(source)
          print('Patched API-key callback and SVG renderer/nullability compile blockers.')
          PY

      - name: Apply Mali safety and API readiness fixes
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          bridge = Path('native/src/bridge.cpp')
          source = bridge.read_text()
          a = source.index('static bool own_memory(ggml_backend_dev_t dev) {')
          b = source.index('\\n}', a) + 2
          source = source[:a] + textwrap.dedent('''\
          static bool own_memory(ggml_backend_dev_t dev) {
          #if defined(__APPLE__) || defined(__ANDROID__)
              // Android GPUs share system RAM; do not count Mali/Dimensity memory
              // as separate VRAM when estimating safe model placement.
              (void)dev; return false;
          #else
              return dev && ggml_backend_dev_type(dev) == GGML_BACKEND_DEVICE_TYPE_GPU;
          #endif
          }''') + source[b:]

          token = 'const bool explicit_backend = requested != "auto"'
          idx = source.index(token)
          line_start = source.rfind('\\n', 0, idx) + 1
          indent = source[line_start:idx]
          if 'unsafe_mali_vulkan' not in source:
              block = textwrap.indent(textwrap.dedent('''\
          const std::string description = ggml_backend_dev_description(dev);
          std::string lower_description = description;
          std::transform(lower_description.begin(), lower_description.end(),
              lower_description.begin(), ::tolower);
          #if defined(__ANDROID__)
          // Block the known-risk Mali Vulkan path until driver stability is verified.
          const bool unsafe_mali_vulkan = lower == "vulkan"
              && (lower_description.find("mali") != std::string::npos
                  || lower_description.find("immortalis") != std::string::npos);
          if (unsafe_mali_vulkan) {
              if (requested == "auto") {
                  if (skipped.empty()) skipped = "Vulkan (Mali safety block)";
                  continue;
              }
              if (requested == "vulkan") throw std::runtime_error(
                  "Vulkan is temporarily blocked on Mali/Immortalis to protect device stability. Select Auto or CPU.");
          }
          #endif
          '''), indent)
              source = source[:line_start] + block + source[line_start:]
          bridge.write_text(source)

          page = Path('lib/features/hosting/presentation/device_hosting_page.dart')
          source = page.read_text()
          import_line = "import '../../../core/l10n/l10n.dart';"
          shared_import = "import '../../../core/providers/shared_providers.dart';"
          if shared_import not in source:
              source = source.replace(import_line, import_line + '\\n' + shared_import, 1)

          first = source.index('    final state = ref.watch(deviceHostingProvider);')
          last_line = '    final controller = ref.read(deviceHostingProvider.notifier);'
          last = source.index(last_line, first) + len(last_line)
          state_block = '''    final state = ref.watch(deviceHostingProvider);
          final manager = ref.watch(modelManagerProvider);
          final model = manager.loadedModel;
          final engine = ref.read(llamaEngineProvider);
          final canStart = model != null && engine.isLoaded && !manager.isLoadingModel;
          final controller = ref.read(deviceHostingProvider.notifier);'''
          source = source[:first] + state_block + source[last:]

          old_button = '''                                : model == null
                                    ? null
                                    : () =>
                                          controller.start(port: _defaultPort),'''
          new_button = '''                                : !canStart
                                    ? null
                                    : () =>
                                          controller.start(port: _defaultPort),'''
          if old_button in source:
              source = source.replace(old_button, new_button, 1)
          elif new_button not in source:
              raise SystemExit('API Start button pattern was not found')

          old_note = """                    const SizedBox(height: AppDesign.sm),
                    Text(
                      'Uses the currently loaded model. The server is limited to your local network; it is not exposed as a public internet API.',"""
          new_note = """                    if (!state.running && !state.starting) ...[
                      const SizedBox(height: AppDesign.sm),
                      Text(
                        model == null
                            ? 'Load a model from this app before starting the API server.'
                            : !engine.isLoaded
                                ? 'The model is listed as loaded, but its inference engine is not ready yet. Reload the model before starting the server.'
                                : manager.isLoadingModel
                                    ? 'Wait for model loading to finish.'
                                    : 'The local model is ready to serve.',
                        style: context.text.bodyMuted,
                      ),
                    ],
                    const SizedBox(height: AppDesign.sm),
                    Text(
                      'Uses the currently loaded model. The server is limited to your local network; it is not exposed as a public internet API.',"""
          if old_note in source:
              source = source.replace(old_note, new_note, 1)
          elif new_note not in source:
              raise SystemExit('API readiness hint insertion point was not found')
          page.write_text(source)
          print('Applied Android UMA accounting, Mali Vulkan safety block, and API readiness gating.')
          PY
      - name: Diagnose model loading and API server gating
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = re.compile(r'nGpuLayers|gpuLayers|gpu_layers|vulkan|Vulkan|isModelLoaded|modelLoaded|isLoading|loadModel|startServer|canStart|serverStatus|isServerRunning|enabled\s*:', re.I)
          roots = [Path('lib'), Path('android/app/src/main')]
          hits = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in ('.dart', '.kt', '.java', '.cpp', '.h', '.hpp'):
                      continue
                  try:
                      lines = path.read_text(errors='replace').splitlines()
                  except Exception:
                      continue
                  matched = [(i, line) for i, line in enumerate(lines) if patterns.search(line)]
                  if not matched:
                      continue
                  print(f'\n===== {path} ({len(matched)} matching lines) =====')
                  for i, line in matched:
                      print(f'{i+1}: {line[:240]}')
                      hits += 1
                      if hits >= 180:
                          break
                  if hits >= 180:
                      break
              if hits >= 180:
                  break
          print(f'\nTOTAL MATCHING SOURCE LINES PRINTED: {hits}')
          print('\n===== DEVICE HOSTING PAGE (first 260 lines) =====')
          p = Path('lib/features/hosting/presentation/device_hosting_page.dart')
          if p.exists():
              for i, line in enumerate(p.read_text(errors='replace').splitlines()[:260], 1):
                  print(f'{i}: {line[:240]}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
          cache-key: flutter-3.47.5-${{ runner.os }}

      - name: Build release APK
        working-directory: project
        shell: bash
        run: bash scripts/build_android.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="project/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          echo "APK size:"
          stat -c '%s bytes' "$apk"
          echo "Checking ZIP integrity and CRC..."
          unzip -tq "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(
            find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -n 1
          )"
          test -n "$build_tools"
          echo "Checking APK alignment..."
          "$build_tools/zipalign" -c -v 4 "$apk"
          echo "Checking APK signature..."
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "All APK checks passed."

      - name: Upload Android APK backup
        uses: actions/upload-artifact@v4
        with:
          name: on-device-llm-android-arm64-release
          path: |
            project/build/app/outputs/flutter-apk/app-release.apk
            project/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
