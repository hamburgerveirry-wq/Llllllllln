name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: "HTTPS download URL for the exact ODLLM source ZIP to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and verify Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and validate selected source archive
        shell: bash
        env:
          SOURCE_ARCHIVE_URL: ${{ inputs.source_archive_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ["SOURCE_ARCHIVE_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("Source archive URL must be a valid HTTPS URL.")
          PY
          curl --fail --location --silent --show-error --retry 3 \
            "$SOURCE_ARCHIVE_URL" -o source.zip
          test -s source.zip
          unzip -tq source.zip
          mkdir -p project
          unzip -q source.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            roots="$(find project -mindepth 2 -maxdepth 3 -name pubspec.yaml -print)"
            if [ "$(printf '%s\n' "$roots" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "Could not identify one Flutter project root in the archive."
              exit 1
            fi
            project_root="$(dirname "$roots")"
            mv "$project_root" project-root
            rm -rf project
            mv project-root project
          fi
          test -f project/pubspec.yaml
          test -f project/scripts/build_android.sh
          echo "Source archive extracted and Flutter project root verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
          cache-key: flutter-3.47.5-${{ runner.os }}

      - name: Build release APK
        working-directory: project
        shell: bash
        run: bash scripts/build_android.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="project/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          unzip -tq "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          "$build_tools/zipalign" -c -v 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK integrity, alignment, signature, and SHA-256 checks passed."

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-device-llm-android-release
          path: |
            project/build/app/outputs/flutter-apk/app-release.apk
            project/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
